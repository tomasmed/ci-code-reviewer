name: "CI Code Reviewer"
description: "Open-source agentic code reviewer powered by LiteLLM and pluggable agent harnesses."
author: "tomasmed"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  model:
    description: "LLM model identifier supported by LiteLLM (e.g., anthropic/claude-3-5-sonnet-20241022, openai/gpt-4o, ollama/qwen2.5-coder:7b)."
    required: false
    default: "anthropic/claude-3-5-sonnet-20241022"
  github_token:
    description: "GitHub token used to read pull request diffs and post review comments."
    required: true
    default: ${{ github.token }}
  config_path:
    description: "Relative path to custom configuration file (.ci-reviewer.yml)."
    required: false
    default: ".ci-reviewer.yml"
  harness:
    description: "Review harness to execute: 'native' (fastest), 'strands' (AWS Strands SDK), or 'maf' (Microsoft Agent Framework)."
    required: false
    default: "native"
  dry_run:
    description: "If true, logs review findings to CI console without publishing comments to the pull request."
    required: false
    default: "false"
  emit_vote:
    description: "Allow agent to cast official PR review vote (APPROVE / REQUEST_CHANGES). If false, submits as advisory COMMENT."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Run CI Code Reviewer
      shell: bash
      run: |
        REF="${{ github.action_ref }}"
        PKG_SRC="git+https://github.com/tomasmed/ci-code-reviewer.git"
        if [ -n "$REF" ]; then
          PKG_SRC="${PKG_SRC}@${REF}"
        fi
        uvx --from "$PKG_SRC" ci-code-reviewer review \
          --pr "${{ github.event.pull_request.number }}" \
          --model "${{ inputs.model }}" \
          --harness "${{ inputs.harness }}" \
          --config "${{ inputs.config_path }}" \
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
          ${{ inputs.emit_vote == 'true' && '--emit-vote' || '' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
