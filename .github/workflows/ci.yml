name: Continuous Integration & Verification Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify:
    name: Deterministic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # NODE / JS / TS (Next.js, Vue, Svelte)
      # -------------------------------------------------------------
      - name: Check Node / TS
        id: check-node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm (if Node)
        if: steps.check-node.outputs.exists == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js (if Node)
        if: steps.check-node.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install & Run Node Checks
        if: steps.check-node.outputs.exists == 'true'
        run: |
          pnpm install
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh

      # -------------------------------------------------------------
      # C# / .NET
      # -------------------------------------------------------------
      - name: Check .NET
        id: check-dotnet
        run: |
          if find . -maxdepth 2 -name "*.csproj" -print -quit | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET (if C#)
        if: steps.check-dotnet.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run .NET Checks
        if: steps.check-dotnet.outputs.exists == 'true'
        run: |
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh

      # -------------------------------------------------------------
      # PYTHON (uv)
      # -------------------------------------------------------------
      - name: Check Python
        id: check-python
        run: |
          if [ -f "pyproject.toml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv (if Python)
        if: steps.check-python.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Python Checks
        if: steps.check-python.outputs.exists == 'true'
        run: |
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh

      # -------------------------------------------------------------
      # GO
      # -------------------------------------------------------------
      - name: Check Go
        id: check-go
        run: |
          if [ -f "go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go (if Go)
        if: steps.check-go.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go Checks
        if: steps.check-go.outputs.exists == 'true'
        run: |
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh
