[project]
name = "ci-code-reviewer"
version = "0.1.0"
description = "Open-source agentic code reviewer for GitHub Actions, CI pipelines, and automated PR review."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }
authors = [
    { name = "tomasmed" }
]
dependencies = [
    "litellm>=1.50.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
strands = [
    "strands-agents>=0.1.0",
]
maf = [
    "agent-framework>=0.1.0",
]
all-harnesses = [
    "strands-agents>=0.1.0",
    "agent-framework>=0.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
ci-code-reviewer = "ci_code_reviewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
